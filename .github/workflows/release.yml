name: Android release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
      - run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.B4_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/b4assistant-release.p12"
          chmod 600 "$RUNNER_TEMP/b4assistant-release.p12"
      - name: Build signed APK
        env:
          B4_SIGNING_STORE_FILE: ${{ runner.temp }}/b4assistant-release.p12
          B4_SIGNING_STORE_PASSWORD: ${{ secrets.B4_SIGNING_PASSWORD }}
        run: |
          test -n "$B4_SIGNING_STORE_PASSWORD"
          ./gradlew assembleRelease --no-daemon
      - name: Verify and prepare APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "B4Assistant-${GITHUB_REF_NAME}.apk"
          sha256sum "B4Assistant-${GITHUB_REF_NAME}.apk" > "B4Assistant-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "B4Assistant-${GITHUB_REF_NAME}.apk" "B4Assistant-${GITHUB_REF_NAME}.apk.sha256" --title "B4Assistant $GITHUB_REF_NAME" --generate-notes --verify-tag
