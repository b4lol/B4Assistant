plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseStoreFile = System.getenv('B4_SIGNING_STORE_FILE')
def releaseStorePassword = System.getenv('B4_SIGNING_STORE_PASSWORD')

android {
    namespace 'com.b4lol.assistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.b4lol.assistant'
        minSdk 29
        targetSdk 36
        versionCode 102
        versionName '1.2.0'
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias 'b4assistant'
                keyPassword releaseStorePassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile && releaseStorePassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}


dependencies {
    implementation platform('androidx.compose:compose-bom:2026.04.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha17'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
